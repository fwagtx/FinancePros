<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<script src="blue.js"></script>
<script src="world.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#1432E6}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"Red Hat Display",sans-serif;color:#fff}
#bg{position:absolute;inset:-40px;background-color:#1432E6;background-image:radial-gradient(circle,rgba(255,255,255,.11) 3px,transparent 3.6px);background-size:26px 26px}
#vig{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 38%,rgba(255,255,255,.07),rgba(0,0,0,0) 45%,rgba(6,10,40,.38) 100%)}
.abs{position:absolute}
.pill{display:inline-flex;align-items:center;gap:12px;font:600 30px/1 "Red Hat Mono";letter-spacing:.08em;text-transform:uppercase;padding:14px 22px 12px;border-radius:999px;background:#fff;color:#1432E6;white-space:nowrap}
.hd{font-weight:900;letter-spacing:-.035em;word-spacing:.06em;line-height:1.1;text-transform:uppercase}
.hl{background:#fff;color:#1432E6;padding:0 .12em;border-radius:.1em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.mono{font-family:"Red Hat Mono";font-weight:600;letter-spacing:.06em;text-transform:uppercase}
#scene{position:absolute;left:0;top:0;width:1080px;height:1920px}
#cap{position:absolute;left:70px;width:900px;top:1000px;font:800 56px/1.22 "Red Hat Display";letter-spacing:-.015em;text-shadow:0 3px 14px rgba(6,10,40,.35)}
#cap .w{display:inline-block;padding:0 .12em;border-radius:.14em;margin:0 -.02em}
#cap .w.on{background:#fff;color:#1432E6;text-shadow:none}
#cap .who{display:inline-block;font:600 24px/1 "Red Hat Mono";letter-spacing:.1em;background:#2BD98A;color:#0A0F2E;border-radius:999px;padding:9px 14px 7px;margin-right:14px;vertical-align:8px}
#tk{position:absolute}
#tk svg{display:block;width:100%;height:auto}
#dot{position:absolute}
#wipe{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.95) 5px,transparent 6px);background-size:26px 26px;opacity:0}
.card{background:rgba(10,15,46,.55);border-radius:34px}
.chip{display:inline-flex;align-items:center;gap:12px;font:600 26px/1 "Red Hat Mono";letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:12px 18px 10px}
</style></head><body>
<div id="stage">
  <div id="bg"></div><div id="vig"></div>
  <div id="fx" class="abs" style="inset:0;pointer-events:none"></div>
  <div id="scene"></div>
  <div id="top" class="abs" style="left:70px;top:176px"></div>
  <div id="bug" class="abs" style="right:150px;top:172px;background:#0A0F2E;border-radius:18px;padding:13px 15px"></div>
  <div id="dot"></div>
  <div id="tk"></div>
  <div id="cap"></div>
  <div id="wipe"></div>
  <div id="prog" class="abs" style="left:0;top:0;height:8px;width:0;background:#2BD98A;box-shadow:0 0 14px #2BD98A"></div>
</div>
<script src="scenes.js"></script>
</body></html>
