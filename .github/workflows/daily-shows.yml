name: FinancePros TV daily shows

# Cron is UTC. Each show fires at both the summer (EDT) and winter (EST) offsets;
# daily.py only runs inside the right Eastern-time hour, so exactly one of the two does work.
on:
  schedule:
    - cron: "2 11,12 * * 1-5"    # Morning Brief: builds ~7:00 ET, posts 7:30 ET
    - cron: "2 16,17 * * 1-5"    # Midday Pulse: builds ~12:00 ET, posts 12:30 ET
    - cron: "7 20,21 * * 1-5"    # Closing Bell: builds ~4:05 PM ET, posts 4:30 PM ET
    - cron: "40 13-22 * * 1-5"   # FP Flash check: hourly, weekdays 9 AM-5 PM ET
  workflow_dispatch:
    inputs:
      show:
        description: "Show to run now"
        type: choice
        options: [morning, midday, close, flash]
        required: true

permissions:
  contents: write

concurrency:
  group: financepros-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      METRICOOL_USER_TOKEN: ${{ secrets.METRICOOL_USER_TOKEN }}
      METRICOOL_USER_ID: ${{ vars.METRICOOL_USER_ID }}
      METRICOOL_BLOG_ID: ${{ vars.METRICOOL_BLOG_ID }}
      METRICOOL_DRAFT: ${{ vars.METRICOOL_DRAFT || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pick the show
        id: show
        run: |
          case "${{ github.event.schedule }}" in
            "2 11,12 * * 1-5")  s=morning ;;
            "2 16,17 * * 1-5")  s=midday ;;
            "7 20,21 * * 1-5")  s=close ;;
            "40 13-22 * * 1-5") s=flash ;;
            *) s="${{ inputs.show }}" ;;
          esac
          echo "name=$s" >> "$GITHUB_OUTPUT"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && echo "force=--force" >> "$GITHUB_OUTPUT" || echo "force=" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: engine/models
          key: kokoro-v1.0

      - name: Install
        working-directory: engine
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
          npm install --silent
          npx playwright install --with-deps chromium
          ./setup_models.sh

      - name: Make and schedule the episode
        working-directory: engine
        run: |
          git config user.name "FinancePros TV bot"
          git config user.email "actions@users.noreply.github.com"
          python daily.py --show "${{ steps.show.outputs.name }}" ${{ steps.show.outputs.force }}

      - name: Keep the research and fact-check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ steps.show.outputs.name }}-${{ github.run_id }}
          path: engine/episodes/daily/
          if-no-files-found: ignore
