name: FinancePros TV daily shows

# Runs every hour. engine/daily.py checks the weekly plan (Eastern time) and makes whatever is due:
# ~3 short videos a day for Instagram, Facebook, TikTok and YouTube, plus 3 long-form YouTube videos a week.
on:
  schedule:
    - cron: "5 * * * *"          # hourly; daily.py runs whatever the weekly plan says is due this Eastern-time hour
  workflow_dispatch:
    inputs:
      show:
        description: "Show to run now"
        type: choice
        options: [auto, morning, lesson, close, world, recap, ahead, flash, lf-world, lf-school, lf-week]
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      METRICOOL_USER_TOKEN: ${{ secrets.METRICOOL_USER_TOKEN }}
      METRICOOL_USER_ID: ${{ vars.METRICOOL_USER_ID }}
      METRICOOL_BLOG_ID: ${{ vars.METRICOOL_BLOG_ID }}
      METRICOOL_DRAFT: ${{ vars.METRICOOL_DRAFT || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pick the show
        id: show
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.show }}" >> "$GITHUB_OUTPUT"; echo "force=--force" >> "$GITHUB_OUTPUT"
          else
            echo "name=auto" >> "$GITHUB_OUTPUT"; echo "force=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: engine/models
          key: kokoro-v1.0

      - name: Install
        working-directory: engine
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
          npm install --silent
          npx playwright install --with-deps chromium
          ./setup_models.sh

      - name: Make and schedule the episode
        working-directory: engine
        run: |
          git config user.name "FinancePros TV bot"
          git config user.email "actions@users.noreply.github.com"
          python daily.py --show "${{ steps.show.outputs.name }}" ${{ steps.show.outputs.force }}

      - name: Keep the research and fact-check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ steps.show.outputs.name }}-${{ github.run_id }}
          path: engine/episodes/daily/
          if-no-files-found: ignore
